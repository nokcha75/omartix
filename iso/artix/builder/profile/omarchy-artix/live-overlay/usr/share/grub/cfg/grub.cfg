# Omarchy installation media does not expose Artix's GRUB setup menus.
# Locale and keyboard selection belong to the Omarchy wizard on tty1, after
# the live system has booted. artools expands the ISO-specific kernel arguments
# in kernels.cfg, which this minimal loader sources below.
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod linux

# Keep a serial console available for VM acceptance logs while retaining the
# graphical console for normal users.
insmod serial
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

set kopts="lang=en_US keytable=us tz=UTC console=ttyS0,115200"
set default=0
set timeout_style=hidden
set timeout=0

source /boot/grub/kernels.cfg
