# The @kopts@ token is expanded by artools after the ISO label is known. Keep
# the stock entry's argument construction: GRUB passes its second argument to
# the `linux` line as the kernel command line. Only the duplicate device menu
# entry is removed.
if cpuid -l; then
    havekernel="Y"
    title=""
    for kopt in x86_64 $kopts @kopts@; do
        if [ -n "$title" ] ; then
            title="$title $kopt";
        else
            title="$kopt";
        fi;
    done
    menuentry "Omarchy Installer" --class=omarchy "$title @ro_opts@" {# set arguments above with the editor
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
fi

# The Omarchy-owned grub.cfg contains no setup-menu entries, so this is the
# first and only menu entry.
set default=0
set timeout_style=hidden
set timeout=0
