# omarchy-sudo-passwordless writes /etc/sudoers.d/99-omarchy-nopasswd-<user> and
# starts the Omartix expiry helper to remove it again. The helper does not
# survive a reboot, so remove any remaining grant during early boot. Boot-only
# (r!) ensures a later tmpfiles cleanup cannot cut a live grant short.
r! /etc/sudoers.d/99-omarchy-nopasswd-*
